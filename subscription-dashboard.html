<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サブスクリプション ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: var(--gray-800);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 32px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 4px;
        }

        .last-updated {
            font-size: 14px;
            color: var(--gray-500);
        }

        /* Filters */
        .filters {
            background: white;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            color: var(--gray-700);
            background: var(--gray-50);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 150px;
        }

        .filter-group select:hover,
        .filter-group input:hover {
            border-color: var(--primary-light);
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
        }

        .chip {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .chip:hover {
            background: var(--gray-200);
        }

        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        .chip.active:hover {
            background: var(--primary-dark);
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .kpi-card.active::before { background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
        .kpi-card.new::before { background: linear-gradient(90deg, var(--success), #34d399); }
        .kpi-card.churn::before { background: linear-gradient(90deg, var(--danger), #f87171); }
        .kpi-card.mrr::before { background: linear-gradient(90deg, var(--info), #60a5fa); }
        .kpi-card.trial::before { background: linear-gradient(90deg, var(--warning), #fbbf24); }

        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .kpi-card.active .kpi-icon { background: rgba(99, 102, 241, 0.1); }
        .kpi-card.new .kpi-icon { background: rgba(16, 185, 129, 0.1); }
        .kpi-card.churn .kpi-icon { background: rgba(239, 68, 68, 0.1); }
        .kpi-card.mrr .kpi-icon { background: rgba(59, 130, 246, 0.1); }
        .kpi-card.trial .kpi-icon { background: rgba(245, 158, 11, 0.1); }

        .kpi-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 12px;
        }

        .kpi-change {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .kpi-change.positive {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .kpi-change.negative {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Platform breakdown */
        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .breakdown-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .breakdown-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 20px;
        }

        .breakdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--gray-50);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .breakdown-item:last-child {
            margin-bottom: 0;
        }

        .breakdown-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .platform-icon.ios {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .platform-icon.android {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .breakdown-label {
            font-weight: 600;
            color: var(--gray-700);
        }

        .breakdown-sublabel {
            font-size: 13px;
            color: var(--gray-500);
        }

        .breakdown-value {
            text-align: right;
        }

        .breakdown-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .breakdown-percent {
            font-size: 13px;
            color: var(--gray-500);
        }

        /* Progress bar */
        .progress-bar {
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-fill.ios {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .progress-fill.android {
            background: linear-gradient(90deg, #11998e, #38ef7d);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .filters {
                padding: 16px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .kpi-value {
                font-size: 24px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kpi-card, .chart-card, .breakdown-card {
            animation: fadeIn 0.5s ease forwards;
        }

        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.15s; }
        .kpi-card:nth-child(3) { animation-delay: 0.2s; }
        .kpi-card:nth-child(4) { animation-delay: 0.25s; }
        .kpi-card:nth-child(5) { animation-delay: 0.3s; }

        /* Raw Data Button */
        .raw-data-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--gray-700) 0%, var(--gray-800) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .raw-data-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 1200px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--gray-100);
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: var(--gray-600);
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--gray-200);
            color: var(--gray-900);
        }

        .modal-body {
            padding: 24px;
            overflow: auto;
            flex: 1;
        }

        .modal-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .modal-controls select {
            padding: 8px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            background: var(--gray-50);
        }

        .modal-controls button {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-controls button:hover {
            background: var(--primary-dark);
        }

        .modal-controls button.secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .modal-controls button.secondary:hover {
            background: var(--gray-300);
        }

        .data-table-container {
            overflow: auto;
            max-height: 500px;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th,
        .data-table td {
            padding: 10px 14px;
            text-align: right;
            border-bottom: 1px solid var(--gray-100);
            white-space: nowrap;
        }

        .data-table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th:first-child,
        .data-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: white;
            z-index: 5;
        }

        .data-table th:first-child {
            z-index: 15;
            background: var(--gray-50);
        }

        .data-table tr:hover td {
            background: var(--gray-50);
        }

        .data-table tr:hover td:first-child {
            background: var(--gray-100);
        }

        .json-view {
            background: var(--gray-900);
            color: #e5e7eb;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow: auto;
            max-height: 500px;
        }

        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fcd34d; }

        .data-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            padding: 16px;
            background: var(--gray-50);
            border-radius: 12px;
        }

        .data-stat {
            text-align: center;
        }

        .data-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .data-stat-label {
            font-size: 12px;
            color: var(--gray-500);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>サブスクリプション ダッシュボード</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span class="last-updated" id="lastUpdated"></span>
                <button class="raw-data-btn" id="openRawDataBtn">
                    <span>📋</span> 生データ表示
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>期間</label>
                <select id="periodFilter">
                    <option value="7">過去7日間</option>
                    <option value="30" selected>過去30日間</option>
                    <option value="90">過去90日間</option>
                    <option value="180">過去6ヶ月</option>
                    <option value="365">過去1年</option>
                </select>
            </div>
            <div class="filter-group">
                <label>プラットフォーム</label>
                <div class="filter-chips" id="platformFilter">
                    <div class="chip active" data-value="all">すべて</div>
                    <div class="chip" data-value="ios">iOS</div>
                    <div class="chip" data-value="android">Android</div>
                </div>
            </div>
            <div class="filter-group">
                <label>プラン</label>
                <div class="filter-chips" id="planFilter">
                    <div class="chip active" data-value="all">すべて</div>
                    <div class="chip" data-value="monthly">月額</div>
                    <div class="chip" data-value="yearly">年額</div>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card active">
                <div class="kpi-icon">📊</div>
                <div class="kpi-label">有効サブスク数</div>
                <div class="kpi-value" id="activeSubsValue">-</div>
                <span class="kpi-change positive" id="activeSubsChange">-</span>
            </div>
            <div class="kpi-card new">
                <div class="kpi-icon">🚀</div>
                <div class="kpi-label">新規登録</div>
                <div class="kpi-value" id="newSubsValue">-</div>
                <span class="kpi-change positive" id="newSubsChange">-</span>
            </div>
            <div class="kpi-card churn">
                <div class="kpi-icon">📉</div>
                <div class="kpi-label">解約</div>
                <div class="kpi-value" id="churnValue">-</div>
                <span class="kpi-change negative" id="churnChange">-</span>
            </div>
            <div class="kpi-card mrr">
                <div class="kpi-icon">💰</div>
                <div class="kpi-label">MRR</div>
                <div class="kpi-value" id="mrrValue">-</div>
                <span class="kpi-change positive" id="mrrChange">-</span>
            </div>
            <div class="kpi-card trial">
                <div class="kpi-icon">🎯</div>
                <div class="kpi-label">トライアル転換率</div>
                <div class="kpi-value" id="trialValue">-</div>
                <span class="kpi-change positive" id="trialChange">-</span>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">サブスクリプション推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="subsChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">MRR推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="mrrChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">新規 vs 解約</h3>
                </div>
                <div class="chart-container">
                    <canvas id="flowChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">トライアル転換率推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="trialChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Platform Breakdown -->
        <div class="breakdown-grid">
            <div class="breakdown-card">
                <h3 class="breakdown-title">プラットフォーム別</h3>
                <div id="platformBreakdown"></div>
            </div>
            <div class="breakdown-card">
                <h3 class="breakdown-title">プラン別</h3>
                <div id="planBreakdown"></div>
            </div>
        </div>
    </div>

    <!-- Raw Data Modal -->
    <div class="modal-overlay" id="rawDataModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">生データ表示</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="data-stats" id="dataStats"></div>
                <div class="modal-controls">
                    <select id="dataViewType">
                        <option value="table">テーブル表示</option>
                        <option value="json">JSON表示</option>
                    </select>
                    <select id="dataExportRange">
                        <option value="filtered">フィルター適用データ</option>
                        <option value="all">全データ (400日分)</option>
                    </select>
                    <button id="copyDataBtn">📋 コピー</button>
                    <button id="downloadCsvBtn" class="secondary">⬇️ CSV</button>
                    <button id="downloadJsonBtn" class="secondary">⬇️ JSON</button>
                </div>
                <div id="dataContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== Data Generation =====
        class DataGenerator {
            constructor() {
                this.baseDate = new Date();
                // Random seed based on current timestamp - data changes on each load
                this.seed = Date.now() % 1000000;
                console.log(`🎲 Data seed: ${this.seed}`);
            }

            // Seeded random with better distribution
            random() {
                this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff;
                return this.seed / 0x7fffffff;
            }

            // Gaussian random for more natural variation
            gaussianRandom(mean = 0, stdev = 1) {
                const u = 1 - this.random();
                const v = this.random();
                const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                return z * stdev + mean;
            }

            // Generate realistic subscription data with trends and spikes
            generateData(days) {
                const data = [];

                // Randomize initial values with variance
                let iosMonthlyActive = Math.round(7000 + this.random() * 4000);
                let iosYearlyActive = Math.round(2500 + this.random() * 1500);
                let androidMonthlyActive = Math.round(5500 + this.random() * 3000);
                let androidYearlyActive = Math.round(1800 + this.random() * 1200);

                const monthlyPrice = 980;
                const yearlyPrice = 9800;

                // Random growth trend (0.02% - 0.08% daily)
                const baseTrendRate = 0.0002 + this.random() * 0.0006;

                // Random seasonal amplitude
                const seasonalAmplitude = 0.05 + this.random() * 0.1;

                // Randomize when spikes occur (campaign days)
                const campaignDays = [];
                const numCampaigns = Math.floor(2 + this.random() * 5);
                for (let c = 0; c < numCampaigns; c++) {
                    campaignDays.push(Math.floor(this.random() * days));
                }

                // Random "bad period" (technical issues, competitor launch, etc.)
                const badPeriodStart = Math.floor(this.random() * (days - 30));
                const badPeriodLength = Math.floor(5 + this.random() * 10);

                for (let i = days - 1; i >= 0; i--) {
                    const date = new Date(this.baseDate);
                    date.setDate(date.getDate() - i);

                    // Day of week effect (weekends lower, with variance)
                    const dayOfWeek = date.getDay();
                    const weekendBase = (dayOfWeek === 0 || dayOfWeek === 6) ? 0.65 : 1.0;
                    const weekendFactor = weekendBase + this.gaussianRandom(0, 0.08);

                    // Seasonal trend with sine wave
                    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
                    const seasonalFactor = 1 + Math.sin(dayOfYear / 365 * Math.PI * 2) * seasonalAmplitude;

                    // Growth trend with some randomness
                    const trendFactor = 1 + (days - i) * baseTrendRate * (0.8 + this.random() * 0.4);

                    // Marketing campaign spikes
                    const dayIndex = days - 1 - i;
                    let spikeFactor = 1.0;
                    for (const campaignDay of campaignDays) {
                        const distFromCampaign = Math.abs(dayIndex - campaignDay);
                        if (distFromCampaign <= 2) {
                            spikeFactor = Math.max(spikeFactor, 2.0 + this.random() * 1.5 - distFromCampaign * 0.3);
                        }
                    }

                    // Bad period effect
                    let badPeriodFactor = 1.0;
                    if (dayIndex >= badPeriodStart && dayIndex < badPeriodStart + badPeriodLength) {
                        badPeriodFactor = 0.6 + this.random() * 0.2;
                    }

                    // Random daily noise
                    const dailyNoise = 0.85 + this.random() * 0.3;

                    // Combined factor
                    const combinedFactor = weekendFactor * seasonalFactor * trendFactor * spikeFactor * badPeriodFactor * dailyNoise;

                    // Generate daily new subscriptions with Gaussian variation
                    const iosMonthlyNew = Math.max(0, Math.round(this.gaussianRandom(40, 12) * combinedFactor));
                    const iosYearlyNew = Math.max(0, Math.round(this.gaussianRandom(10, 4) * combinedFactor));
                    const androidMonthlyNew = Math.max(0, Math.round(this.gaussianRandom(32, 10) * combinedFactor));
                    const androidYearlyNew = Math.max(0, Math.round(this.gaussianRandom(7, 3) * combinedFactor));

                    // Churn with variance (monthly has higher churn than yearly)
                    const baseChurnRate = 0.75 + this.random() * 0.3;
                    const churnBadPeriod = badPeriodFactor < 1 ? 1.3 : 1.0;
                    const iosMonthlyChurn = Math.max(0, Math.round(iosMonthlyNew * baseChurnRate * 0.9 * churnBadPeriod));
                    const iosYearlyChurn = Math.max(0, Math.round(iosYearlyNew * baseChurnRate * 0.35));
                    const androidMonthlyChurn = Math.max(0, Math.round(androidMonthlyNew * baseChurnRate * 0.95 * churnBadPeriod));
                    const androidYearlyChurn = Math.max(0, Math.round(androidYearlyNew * baseChurnRate * 0.4));

                    // Update active counts
                    iosMonthlyActive = Math.max(1000, iosMonthlyActive + iosMonthlyNew - iosMonthlyChurn);
                    iosYearlyActive = Math.max(500, iosYearlyActive + iosYearlyNew - iosYearlyChurn);
                    androidMonthlyActive = Math.max(800, androidMonthlyActive + androidMonthlyNew - androidMonthlyChurn);
                    androidYearlyActive = Math.max(400, androidYearlyActive + androidYearlyNew - androidYearlyChurn);

                    // Trial conversion with variance and spike bonus
                    const spikeBonus = spikeFactor > 1.5 ? 0.08 : 0;
                    const badPeriodPenalty = badPeriodFactor < 1 ? -0.1 : 0;
                    const iosTrialConversion = Math.min(0.85, Math.max(0.25,
                        this.gaussianRandom(0.52, 0.08) + spikeBonus + badPeriodPenalty));
                    const androidTrialConversion = Math.min(0.80, Math.max(0.20,
                        this.gaussianRandom(0.47, 0.09) + spikeBonus + badPeriodPenalty));

                    // Calculate MRR
                    const mrr = (iosMonthlyActive + androidMonthlyActive) * monthlyPrice +
                               (iosYearlyActive + androidYearlyActive) * (yearlyPrice / 12);

                    data.push({
                        date: date.toISOString().split('T')[0],
                        dateLabel: `${date.getMonth() + 1}/${date.getDate()}`,
                        ios: {
                            monthly: {
                                active: iosMonthlyActive,
                                new: iosMonthlyNew,
                                churn: iosMonthlyChurn,
                                trialConversion: iosTrialConversion
                            },
                            yearly: {
                                active: iosYearlyActive,
                                new: iosYearlyNew,
                                churn: iosYearlyChurn,
                                trialConversion: Math.min(0.90, iosTrialConversion + 0.08 + this.random() * 0.05)
                            }
                        },
                        android: {
                            monthly: {
                                active: androidMonthlyActive,
                                new: androidMonthlyNew,
                                churn: androidMonthlyChurn,
                                trialConversion: androidTrialConversion
                            },
                            yearly: {
                                active: androidYearlyActive,
                                new: androidYearlyNew,
                                churn: androidYearlyChurn,
                                trialConversion: Math.min(0.88, androidTrialConversion + 0.06 + this.random() * 0.04)
                            }
                        },
                        mrr: mrr
                    });
                }

                return data;
            }
        }

        // ===== Dashboard Controller =====
        class Dashboard {
            constructor() {
                this.generator = new DataGenerator();
                this.rawData = this.generator.generateData(400);
                this.charts = {};
                this.filters = {
                    period: 30,
                    platform: 'all',
                    plan: 'all'
                };

                this.initFilters();
                this.initCharts();
                this.updateDashboard();
                this.updateLastUpdated();
            }

            initFilters() {
                // Period filter
                document.getElementById('periodFilter').addEventListener('change', (e) => {
                    this.filters.period = parseInt(e.target.value);
                    this.updateDashboard();
                });

                // Platform filter
                document.querySelectorAll('#platformFilter .chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        document.querySelectorAll('#platformFilter .chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        this.filters.platform = chip.dataset.value;
                        this.updateDashboard();
                    });
                });

                // Plan filter
                document.querySelectorAll('#planFilter .chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        document.querySelectorAll('#planFilter .chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        this.filters.plan = chip.dataset.value;
                        this.updateDashboard();
                    });
                });
            }

            getFilteredData() {
                const data = this.rawData.slice(-this.filters.period);
                return data.map(day => {
                    let active = 0, newSubs = 0, churn = 0, trialTotal = 0, trialCount = 0;

                    const platforms = this.filters.platform === 'all' ? ['ios', 'android'] : [this.filters.platform];
                    const plans = this.filters.plan === 'all' ? ['monthly', 'yearly'] : [this.filters.plan];

                    platforms.forEach(platform => {
                        plans.forEach(plan => {
                            const d = day[platform][plan];
                            active += d.active;
                            newSubs += d.new;
                            churn += d.churn;
                            trialTotal += d.trialConversion;
                            trialCount++;
                        });
                    });

                    return {
                        date: day.date,
                        dateLabel: day.dateLabel,
                        active,
                        new: newSubs,
                        churn,
                        trialConversion: trialTotal / trialCount,
                        mrr: this.calculateMRR(day, platforms, plans)
                    };
                });
            }

            calculateMRR(day, platforms, plans) {
                const monthlyPrice = 980;
                const yearlyPrice = 9800;
                let mrr = 0;

                platforms.forEach(platform => {
                    plans.forEach(plan => {
                        const active = day[platform][plan].active;
                        if (plan === 'monthly') {
                            mrr += active * monthlyPrice;
                        } else {
                            mrr += active * (yearlyPrice / 12);
                        }
                    });
                });

                return mrr;
            }

            updateKPIs(data) {
                const latest = data[data.length - 1];
                const previous = data[Math.max(0, data.length - Math.ceil(data.length / 2) - 1)];

                const totalNew = data.reduce((sum, d) => sum + d.new, 0);
                const totalChurn = data.reduce((sum, d) => sum + d.churn, 0);
                const avgTrialConversion = data.reduce((sum, d) => sum + d.trialConversion, 0) / data.length;

                // Update values
                document.getElementById('activeSubsValue').textContent = latest.active.toLocaleString();
                document.getElementById('newSubsValue').textContent = totalNew.toLocaleString();
                document.getElementById('churnValue').textContent = totalChurn.toLocaleString();
                document.getElementById('mrrValue').textContent = '¥' + (latest.mrr / 1000000).toFixed(2) + 'M';
                document.getElementById('trialValue').textContent = (avgTrialConversion * 100).toFixed(1) + '%';

                // Update changes
                const activeChange = ((latest.active - previous.active) / previous.active * 100).toFixed(1);
                const mrrChange = ((latest.mrr - previous.mrr) / previous.mrr * 100).toFixed(1);
                const previousTrialAvg = data.slice(0, Math.ceil(data.length / 2)).reduce((sum, d) => sum + d.trialConversion, 0) / Math.ceil(data.length / 2);
                const recentTrialAvg = data.slice(Math.ceil(data.length / 2)).reduce((sum, d) => sum + d.trialConversion, 0) / Math.floor(data.length / 2);
                const trialChange = ((recentTrialAvg - previousTrialAvg) / previousTrialAvg * 100).toFixed(1);

                this.updateChangeElement('activeSubsChange', activeChange);
                this.updateChangeElement('mrrChange', mrrChange);
                this.updateChangeElement('trialChange', trialChange);

                // For new and churn, compare to previous period
                const halfLength = Math.ceil(data.length / 2);
                const firstHalfNew = data.slice(0, halfLength).reduce((sum, d) => sum + d.new, 0);
                const secondHalfNew = data.slice(halfLength).reduce((sum, d) => sum + d.new, 0);
                const newChange = ((secondHalfNew - firstHalfNew) / firstHalfNew * 100).toFixed(1);

                const firstHalfChurn = data.slice(0, halfLength).reduce((sum, d) => sum + d.churn, 0);
                const secondHalfChurn = data.slice(halfLength).reduce((sum, d) => sum + d.churn, 0);
                const churnChange = ((secondHalfChurn - firstHalfChurn) / firstHalfChurn * 100).toFixed(1);

                this.updateChangeElement('newSubsChange', newChange);
                this.updateChangeElement('churnChange', churnChange, true);
            }

            updateChangeElement(elementId, change, invertColors = false) {
                const element = document.getElementById(elementId);
                const isPositive = parseFloat(change) >= 0;
                const displayPositive = invertColors ? !isPositive : isPositive;

                element.textContent = (isPositive ? '+' : '') + change + '%';
                element.className = 'kpi-change ' + (displayPositive ? 'positive' : 'negative');
            }

                const labels = data.map(d => d.dateLabel);

                // Subs chart
                this.charts.subs.data.labels = labels;

                    let totalActive = 0, totalNew = 0, totalChurn = 0, trialSum = 0, trialCount = 0;

                    platforms.forEach(platform => {

                html += '</tr></thead><tbody>';

                data.slice().reverse().forEach(row => {
                    html += '<tr>';
                    html += `<td>${row.date}</td>`;
                    html += `<td>${row.active.toLocaleString()}</td>`;
                    html += `<td style="color: #10b981;">+${row.new.toLocaleString()}</td>`;
                    html += `<td style="color: #ef4444;">-${row.churn.toLocaleString()}</td>`;
                    html += `<td style="color: ${row.net >= 0 ? '#10b981' : '#ef4444'};">${row.net >= 0 ? '+' : ''}${row.net.toLocaleString()}</td>`;
                    html += `<td>${row.trialConversion}%</td>`;
                    html += `<td>¥${(row.mrr / 1000000).toFixed(2)}M</td>`;
                    html += '</tr>';
                });

                html += '</tbody></table></div>';
                return html;
            }

            renderJSON(data) {
                const json = JSON.stringify(data, null, 2);
                const highlighted = json
                    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                    .replace(/: "([^"]+)"/g, ': <span class="json-string">"$1"</span>')
                    .replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>');

                return `<pre class="json-view">${highlighted}</pre>`;
            }

            copyData() {
                const data = this.getRawDataForExport();
                const viewType = document.getElementById('dataViewType').value;
                let text;

                if (viewType === 'table') {
                    const headers = ['date', 'active', 'new', 'churn', 'net', 'trialConversion', 'mrr'];
                    const rows = data.map(row => headers.map(h => row[h]).join('\t'));
                    text = headers.join('\t') + '\n' + rows.join('\n');
                } else {
                    text = JSON.stringify(data, null, 2);
                }

                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyDataBtn');
                    const original = btn.textContent;
                    btn.textContent = '✓ コピー完了';
                    setTimeout(() => btn.textContent = original, 2000);
                });
            }

            downloadCSV() {
                const data = this.getRawDataForExport();
                const headers = Object.keys(data[0]);
                const csv = [
                    headers.join(','),
                    ...data.map(row => headers.map(h => row[h]).join(','))
                ].join('\n');

                this.downloadFile(csv, 'subscription_data.csv', 'text/csv');
            }

            downloadJSON() {
                const data = this.getRawDataForExport();
                const json = JSON.stringify(data, null, 2);
                this.downloadFile(json, 'subscription_data.json', 'application/json');
            }

            downloadFile(content, filename, type) {
                const blob = new Blob([content], { type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = new Dashboard();
            dashboard.initRawDataViewer();
        });
    </script>
</body>
</html>
