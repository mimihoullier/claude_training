<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サブスクリプション ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: var(--gray-800);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 32px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 4px;
        }

        .last-updated {
            font-size: 14px;
            color: var(--gray-500);
        }

        /* Filters */
        .filters {
            background: white;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            color: var(--gray-700);
            background: var(--gray-50);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 150px;
        }

        .filter-group select:hover,
        .filter-group input:hover {
            border-color: var(--primary-light);
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
        }

        .chip {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .chip:hover {
            background: var(--gray-200);
        }

        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        .chip.active:hover {
            background: var(--primary-dark);
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .kpi-card.active::before { background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
        .kpi-card.new::before { background: linear-gradient(90deg, var(--success), #34d399); }
        .kpi-card.churn::before { background: linear-gradient(90deg, var(--danger), #f87171); }
        .kpi-card.mrr::before { background: linear-gradient(90deg, var(--info), #60a5fa); }
        .kpi-card.trial::before { background: linear-gradient(90deg, var(--warning), #fbbf24); }

        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .kpi-card.active .kpi-icon { background: rgba(99, 102, 241, 0.1); }
        .kpi-card.new .kpi-icon { background: rgba(16, 185, 129, 0.1); }
        .kpi-card.churn .kpi-icon { background: rgba(239, 68, 68, 0.1); }
        .kpi-card.mrr .kpi-icon { background: rgba(59, 130, 246, 0.1); }
        .kpi-card.trial .kpi-icon { background: rgba(245, 158, 11, 0.1); }

        .kpi-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 12px;
        }

        .kpi-change {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .kpi-change.positive {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .kpi-change.negative {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Platform breakdown */
        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .breakdown-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
        }

        .breakdown-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 20px;
        }

        .breakdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--gray-50);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .breakdown-item:last-child {
            margin-bottom: 0;
        }

        .breakdown-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .platform-icon.ios {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .platform-icon.android {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .breakdown-label {
            font-weight: 600;
            color: var(--gray-700);
        }

        .breakdown-sublabel {
            font-size: 13px;
            color: var(--gray-500);
        }

        .breakdown-value {
            text-align: right;
        }

        .breakdown-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-800);
        }

        .breakdown-percent {
            font-size: 13px;
            color: var(--gray-500);
        }

        /* Progress bar */
        .progress-bar {
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-fill.ios {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .progress-fill.android {
            background: linear-gradient(90deg, #11998e, #38ef7d);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .filters {
                padding: 16px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .kpi-value {
                font-size: 24px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kpi-card, .chart-card, .breakdown-card {
            animation: fadeIn 0.5s ease forwards;
        }

        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.15s; }
        .kpi-card:nth-child(3) { animation-delay: 0.2s; }
        .kpi-card:nth-child(4) { animation-delay: 0.25s; }
        .kpi-card:nth-child(5) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>サブスクリプション ダッシュボード</h1>
            <span class="last-updated" id="lastUpdated"></span>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>期間</label>
                <select id="periodFilter">
                    <option value="7">過去7日間</option>
                    <option value="30" selected>過去30日間</option>
                    <option value="90">過去90日間</option>
                    <option value="180">過去6ヶ月</option>
                    <option value="365">過去1年</option>
                </select>
            </div>
            <div class="filter-group">
                <label>プラットフォーム</label>
                <div class="filter-chips" id="platformFilter">
                    <div class="chip active" data-value="all">すべて</div>
                    <div class="chip" data-value="ios">iOS</div>
                    <div class="chip" data-value="android">Android</div>
                </div>
            </div>
            <div class="filter-group">
                <label>プラン</label>
                <div class="filter-chips" id="planFilter">
                    <div class="chip active" data-value="all">すべて</div>
                    <div class="chip" data-value="monthly">月額</div>
                    <div class="chip" data-value="yearly">年額</div>
                </div>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card active">
                <div class="kpi-icon">📊</div>
                <div class="kpi-label">有効サブスク数</div>
                <div class="kpi-value" id="activeSubsValue">-</div>
                <span class="kpi-change positive" id="activeSubsChange">-</span>
            </div>
            <div class="kpi-card new">
                <div class="kpi-icon">🚀</div>
                <div class="kpi-label">新規登録</div>
                <div class="kpi-value" id="newSubsValue">-</div>
                <span class="kpi-change positive" id="newSubsChange">-</span>
            </div>
            <div class="kpi-card churn">
                <div class="kpi-icon">📉</div>
                <div class="kpi-label">解約</div>
                <div class="kpi-value" id="churnValue">-</div>
                <span class="kpi-change negative" id="churnChange">-</span>
            </div>
            <div class="kpi-card mrr">
                <div class="kpi-icon">💰</div>
                <div class="kpi-label">MRR</div>
                <div class="kpi-value" id="mrrValue">-</div>
                <span class="kpi-change positive" id="mrrChange">-</span>
            </div>
            <div class="kpi-card trial">
                <div class="kpi-icon">🎯</div>
                <div class="kpi-label">トライアル転換率</div>
                <div class="kpi-value" id="trialValue">-</div>
                <span class="kpi-change positive" id="trialChange">-</span>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">サブスクリプション推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="subsChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">MRR推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="mrrChart"></canvas>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">新規 vs 解約</h3>
                </div>
                <div class="chart-container">
                    <canvas id="flowChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">トライアル転換率推移</h3>
                </div>
                <div class="chart-container">
                    <canvas id="trialChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Platform Breakdown -->
        <div class="breakdown-grid">
            <div class="breakdown-card">
                <h3 class="breakdown-title">プラットフォーム別</h3>
                <div id="platformBreakdown"></div>
            </div>
            <div class="breakdown-card">
                <h3 class="breakdown-title">プラン別</h3>
                <div id="planBreakdown"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== Data Generation =====
        class DataGenerator {
            constructor() {
                this.baseDate = new Date();
                this.seed = 12345;
            }

            // Seeded random for reproducibility
            random() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }

            // Generate realistic subscription data with trends and spikes
            generateData(days) {
                const data = [];
                let iosMonthlyActive = 8500;
                let iosYearlyActive = 3200;
                let androidMonthlyActive = 6800;
                let androidYearlyActive = 2400;

                const monthlyPrice = 980;
                const yearlyPrice = 9800;

                for (let i = days - 1; i >= 0; i--) {
                    const date = new Date(this.baseDate);
                    date.setDate(date.getDate() - i);

                    // Day of week effect (weekends lower)
                    const dayOfWeek = date.getDay();
                    const weekendFactor = (dayOfWeek === 0 || dayOfWeek === 6) ? 0.7 : 1.0;

                    // Seasonal trend (slight growth)
                    const trendFactor = 1 + (days - i) * 0.0005;

                    // Random spikes (marketing campaigns, etc.)
                    const spikeChance = this.random();
                    const spikeFactor = spikeChance > 0.95 ? 2.5 : (spikeChance > 0.9 ? 1.8 : 1.0);

                    // Generate daily new subscriptions
                    const iosMonthlyNew = Math.round((35 + this.random() * 25) * weekendFactor * trendFactor * spikeFactor);
                    const iosYearlyNew = Math.round((8 + this.random() * 7) * weekendFactor * trendFactor * spikeFactor);
                    const androidMonthlyNew = Math.round((28 + this.random() * 20) * weekendFactor * trendFactor * spikeFactor);
                    const androidYearlyNew = Math.round((6 + this.random() * 5) * weekendFactor * trendFactor * spikeFactor);

                    // Churn (slightly lower than new for growth)
                    const churnFactor = 0.85 + this.random() * 0.25;
                    const iosMonthlyChurn = Math.round(iosMonthlyNew * churnFactor * 0.9);
                    const iosYearlyChurn = Math.round(iosYearlyNew * churnFactor * 0.4);
                    const androidMonthlyChurn = Math.round(androidMonthlyNew * churnFactor * 0.95);
                    const androidYearlyChurn = Math.round(androidYearlyNew * churnFactor * 0.45);

                    // Update active counts
                    iosMonthlyActive += iosMonthlyNew - iosMonthlyChurn;
                    iosYearlyActive += iosYearlyNew - iosYearlyChurn;
                    androidMonthlyActive += androidMonthlyNew - androidMonthlyChurn;
                    androidYearlyActive += androidYearlyNew - androidYearlyChurn;

                    // Trial conversion (varies between 35-65%)
                    const iosTrialConversion = 0.45 + this.random() * 0.15 + (spikeFactor > 1 ? 0.05 : 0);
                    const androidTrialConversion = 0.40 + this.random() * 0.15 + (spikeFactor > 1 ? 0.05 : 0);

                    // Calculate MRR
                    const mrr = (iosMonthlyActive + androidMonthlyActive) * monthlyPrice +
                               (iosYearlyActive + androidYearlyActive) * (yearlyPrice / 12);

                    data.push({
                        date: date.toISOString().split('T')[0],
                        dateLabel: `${date.getMonth() + 1}/${date.getDate()}`,
                        ios: {
                            monthly: {
                                active: iosMonthlyActive,
                                new: iosMonthlyNew,
                                churn: iosMonthlyChurn,
                                trialConversion: iosTrialConversion
                            },
                            yearly: {
                                active: iosYearlyActive,
                                new: iosYearlyNew,
                                churn: iosYearlyChurn,
                                trialConversion: iosTrialConversion + 0.1
                            }
                        },
                        android: {
                            monthly: {
                                active: androidMonthlyActive,
                                new: androidMonthlyNew,
                                churn: androidMonthlyChurn,
                                trialConversion: androidTrialConversion
                            },
                            yearly: {
                                active: androidYearlyActive,
                                new: androidYearlyNew,
                                churn: androidYearlyChurn,
                                trialConversion: androidTrialConversion + 0.08
                            }
                        },
                        mrr: mrr
                    });
                }

                return data;
            }
        }

        // ===== Dashboard Controller =====
        class Dashboard {
            constructor() {
                this.generator = new DataGenerator();
                this.rawData = this.generator.generateData(400);
                this.charts = {};
                this.filters = {
                    period: 30,
                    platform: 'all',
                    plan: 'all'
                };

                this.initFilters();
                this.initCharts();
                this.updateDashboard();
                this.updateLastUpdated();
            }

            initFilters() {
                // Period filter
                document.getElementById('periodFilter').addEventListener('change', (e) => {
                    this.filters.period = parseInt(e.target.value);
                    this.updateDashboard();
                });

                // Platform filter
                document.querySelectorAll('#platformFilter .chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        document.querySelectorAll('#platformFilter .chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        this.filters.platform = chip.dataset.value;
                        this.updateDashboard();
                    });
                });

                // Plan filter
                document.querySelectorAll('#planFilter .chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        document.querySelectorAll('#planFilter .chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        this.filters.plan = chip.dataset.value;
                        this.updateDashboard();
                    });
                });
            }

            getFilteredData() {
                const data = this.rawData.slice(-this.filters.period);
                return data.map(day => {
                    let active = 0, newSubs = 0, churn = 0, trialTotal = 0, trialCount = 0;

                    const platforms = this.filters.platform === 'all' ? ['ios', 'android'] : [this.filters.platform];
                    const plans = this.filters.plan === 'all' ? ['monthly', 'yearly'] : [this.filters.plan];

                    platforms.forEach(platform => {
                        plans.forEach(plan => {
                            const d = day[platform][plan];
                            active += d.active;
                            newSubs += d.new;
                            churn += d.churn;
                            trialTotal += d.trialConversion;
                            trialCount++;
                        });
                    });

                    return {
                        date: day.date,
                        dateLabel: day.dateLabel,
                        active,
                        new: newSubs,
                        churn,
                        trialConversion: trialTotal / trialCount,
                        mrr: this.calculateMRR(day, platforms, plans)
                    };
                });
            }

            calculateMRR(day, platforms, plans) {
                const monthlyPrice = 980;
                const yearlyPrice = 9800;
                let mrr = 0;

                platforms.forEach(platform => {
                    plans.forEach(plan => {
                        const active = day[platform][plan].active;
                        if (plan === 'monthly') {
                            mrr += active * monthlyPrice;
                        } else {
                            mrr += active * (yearlyPrice / 12);
                        }
                    });
                });

                return mrr;
            }

            initCharts() {
                const chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 10 }
                        },
                        y: {
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            beginAtZero: false
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                };

                // Subscription trend chart
                this.charts.subs = new Chart(document.getElementById('subsChart'), {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: {
                                ...chartOptions.scales.y,
                                ticks: {
                                    callback: (value) => value.toLocaleString()
                                }
                            }
                        }
                    }
                });

                // MRR chart
                this.charts.mrr = new Chart(document.getElementById('mrrChart'), {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: {
                                ...chartOptions.scales.y,
                                ticks: {
                                    callback: (value) => '¥' + (value / 1000000).toFixed(1) + 'M'
                                }
                            }
                        }
                    }
                });

                // New vs Churn chart
                this.charts.flow = new Chart(document.getElementById('flowChart'), {
                    type: 'bar',
                    data: { labels: [], datasets: [] },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: { ...chartOptions.scales.y, beginAtZero: true }
                        }
                    }
                });

                // Trial conversion chart
                this.charts.trial = new Chart(document.getElementById('trialChart'), {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        ...chartOptions,
                        scales: {
                            ...chartOptions.scales,
                            y: {
                                ...chartOptions.scales.y,
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    callback: (value) => value + '%'
                                }
                            }
                        }
                    }
                });
            }

            updateDashboard() {
                const data = this.getFilteredData();
                this.updateKPIs(data);
                this.updateCharts(data);
                this.updateBreakdowns();
            }

            updateKPIs(data) {
                const latest = data[data.length - 1];
                const previous = data[Math.max(0, data.length - Math.ceil(data.length / 2) - 1)];

                const totalNew = data.reduce((sum, d) => sum + d.new, 0);
                const totalChurn = data.reduce((sum, d) => sum + d.churn, 0);
                const avgTrialConversion = data.reduce((sum, d) => sum + d.trialConversion, 0) / data.length;

                // Update values
                document.getElementById('activeSubsValue').textContent = latest.active.toLocaleString();
                document.getElementById('newSubsValue').textContent = totalNew.toLocaleString();
                document.getElementById('churnValue').textContent = totalChurn.toLocaleString();
                document.getElementById('mrrValue').textContent = '¥' + (latest.mrr / 1000000).toFixed(2) + 'M';
                document.getElementById('trialValue').textContent = (avgTrialConversion * 100).toFixed(1) + '%';

                // Update changes
                const activeChange = ((latest.active - previous.active) / previous.active * 100).toFixed(1);
                const mrrChange = ((latest.mrr - previous.mrr) / previous.mrr * 100).toFixed(1);
                const previousTrialAvg = data.slice(0, Math.ceil(data.length / 2)).reduce((sum, d) => sum + d.trialConversion, 0) / Math.ceil(data.length / 2);
                const recentTrialAvg = data.slice(Math.ceil(data.length / 2)).reduce((sum, d) => sum + d.trialConversion, 0) / Math.floor(data.length / 2);
                const trialChange = ((recentTrialAvg - previousTrialAvg) / previousTrialAvg * 100).toFixed(1);

                this.updateChangeElement('activeSubsChange', activeChange);
                this.updateChangeElement('mrrChange', mrrChange);
                this.updateChangeElement('trialChange', trialChange);

                // For new and churn, compare to previous period
                const halfLength = Math.ceil(data.length / 2);
                const firstHalfNew = data.slice(0, halfLength).reduce((sum, d) => sum + d.new, 0);
                const secondHalfNew = data.slice(halfLength).reduce((sum, d) => sum + d.new, 0);
                const newChange = ((secondHalfNew - firstHalfNew) / firstHalfNew * 100).toFixed(1);

                const firstHalfChurn = data.slice(0, halfLength).reduce((sum, d) => sum + d.churn, 0);
                const secondHalfChurn = data.slice(halfLength).reduce((sum, d) => sum + d.churn, 0);
                const churnChange = ((secondHalfChurn - firstHalfChurn) / firstHalfChurn * 100).toFixed(1);

                this.updateChangeElement('newSubsChange', newChange);
                this.updateChangeElement('churnChange', churnChange, true);
            }

            updateChangeElement(elementId, change, invertColors = false) {
                const element = document.getElementById(elementId);
                const isPositive = parseFloat(change) >= 0;
                const displayPositive = invertColors ? !isPositive : isPositive;

                element.textContent = (isPositive ? '+' : '') + change + '%';
                element.className = 'kpi-change ' + (displayPositive ? 'positive' : 'negative');
            }

            updateCharts(data) {
                const labels = data.map(d => d.dateLabel);

                // Subs chart
                this.charts.subs.data.labels = labels;
                this.charts.subs.data.datasets = [{
                    label: '有効サブスク数',
                    data: data.map(d => d.active),
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6
                }];
                this.charts.subs.update();

                // MRR chart
                this.charts.mrr.data.labels = labels;
                this.charts.mrr.data.datasets = [{
                    label: 'MRR',
                    data: data.map(d => d.mrr),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6
                }];
                this.charts.mrr.update();

                // Flow chart (sample every N days for readability)
                const sampleRate = Math.max(1, Math.floor(data.length / 15));
                const sampledData = data.filter((_, i) => i % sampleRate === 0);
                this.charts.flow.data.labels = sampledData.map(d => d.dateLabel);
                this.charts.flow.data.datasets = [
                    {
                        label: '新規',
                        data: sampledData.map(d => d.new * sampleRate),
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderRadius: 4
                    },
                    {
                        label: '解約',
                        data: sampledData.map(d => d.churn * sampleRate),
                        backgroundColor: 'rgba(239, 68, 68, 0.8)',
                        borderRadius: 4
                    }
                ];
                this.charts.flow.update();

                // Trial chart
                this.charts.trial.data.labels = labels;
                this.charts.trial.data.datasets = [{
                    label: 'トライアル転換率',
                    data: data.map(d => d.trialConversion * 100),
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6
                }];
                this.charts.trial.update();
            }

            updateBreakdowns() {
                const latestData = this.rawData[this.rawData.length - 1];
                const plans = this.filters.plan === 'all' ? ['monthly', 'yearly'] : [this.filters.plan];

                // Platform breakdown
                let iosTotal = 0, androidTotal = 0;
                plans.forEach(plan => {
                    iosTotal += latestData.ios[plan].active;
                    androidTotal += latestData.android[plan].active;
                });
                const total = iosTotal + androidTotal;

                document.getElementById('platformBreakdown').innerHTML = `
                    <div class="breakdown-item">
                        <div class="breakdown-left">
                            <div class="platform-icon ios"></div>
                            <div>
                                <div class="breakdown-label">iOS</div>
                                <div class="breakdown-sublabel">Apple App Store</div>
                            </div>
                        </div>
                        <div class="breakdown-value">
                            <div class="breakdown-number">${iosTotal.toLocaleString()}</div>
                            <div class="breakdown-percent">${(iosTotal / total * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill ios" style="width: ${iosTotal / total * 100}%"></div>
                    </div>
                    <div class="breakdown-item" style="margin-top: 12px;">
                        <div class="breakdown-left">
                            <div class="platform-icon android">🤖</div>
                            <div>
                                <div class="breakdown-label">Android</div>
                                <div class="breakdown-sublabel">Google Play Store</div>
                            </div>
                        </div>
                        <div class="breakdown-value">
                            <div class="breakdown-number">${androidTotal.toLocaleString()}</div>
                            <div class="breakdown-percent">${(androidTotal / total * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill android" style="width: ${androidTotal / total * 100}%"></div>
                    </div>
                `;

                // Plan breakdown
                const platforms = this.filters.platform === 'all' ? ['ios', 'android'] : [this.filters.platform];
                let monthlyTotal = 0, yearlyTotal = 0;
                platforms.forEach(platform => {
                    monthlyTotal += latestData[platform].monthly.active;
                    yearlyTotal += latestData[platform].yearly.active;
                });
                const planTotal = monthlyTotal + yearlyTotal;

                document.getElementById('planBreakdown').innerHTML = `
                    <div class="breakdown-item">
                        <div class="breakdown-left">
                            <div class="platform-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); color: white;">📅</div>
                            <div>
                                <div class="breakdown-label">月額プラン</div>
                                <div class="breakdown-sublabel">¥980/月</div>
                            </div>
                        </div>
                        <div class="breakdown-value">
                            <div class="breakdown-number">${monthlyTotal.toLocaleString()}</div>
                            <div class="breakdown-percent">${(monthlyTotal / planTotal * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${monthlyTotal / planTotal * 100}%; background: linear-gradient(90deg, #f59e0b, #fbbf24);"></div>
                    </div>
                    <div class="breakdown-item" style="margin-top: 12px;">
                        <div class="breakdown-left">
                            <div class="platform-icon" style="background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%); color: white;">🎁</div>
                            <div>
                                <div class="breakdown-label">年額プラン</div>
                                <div class="breakdown-sublabel">¥9,800/年 (¥816/月)</div>
                            </div>
                        </div>
                        <div class="breakdown-value">
                            <div class="breakdown-number">${yearlyTotal.toLocaleString()}</div>
                            <div class="breakdown-percent">${(yearlyTotal / planTotal * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${yearlyTotal / planTotal * 100}%; background: linear-gradient(90deg, #8b5cf6, #a78bfa);"></div>
                    </div>
                `;
            }

            updateLastUpdated() {
                const now = new Date();
                document.getElementById('lastUpdated').textContent =
                    `最終更新: ${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            }
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            new Dashboard();
        });
    </script>
</body>
</html>
